<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple personal library. Add books, track what you have read." />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div>
          <h1>Library</h1>
          <p id="stats" class="stats">0 books</p>
        </div>
        <button id="addBook" class="btn btn-primary" type="button">Add a book</button>
      </header>

      <div id="books" class="books"></div>
      <p id="emptyState" class="empty" hidden>
        No books yet. Add your first one to get started.
      </p>
    </main>

    <dialog id="bookDialog">
      <form id="bookForm" method="dialog">
        <div class="dialog-header">
          <h2>Add a book</h2>
          <button class="btn btn-ghost btn-close" type="button" id="closeDialog" aria-label="Close">✕</button>
        </div>

        <label for="title">Title</label>
        <input id="title" type="text" name="title" placeholder="The Hobbit" autocomplete="off" required />

        <label for="author">Author</label>
        <input id="author" type="text" name="author" placeholder="J.R.R. Tolkien" autocomplete="off" required />

        <label for="pages">Pages</label>
        <input id="pages" type="number" name="pages" placeholder="310" min="1" required />

        <label class="checkbox" for="read">
          <input id="read" type="checkbox" name="read" />
          <span>I've read this book</span>
        </label>

        <button class="btn btn-primary btn-block" type="submit">Add book</button>
      </form>
    </dialog>

    <script src="index.js"></script>
  </body>
</html>
